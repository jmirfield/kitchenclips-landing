<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KitchenClips Recipe Share</title>
    <meta name="description" content="Open shared recipes directly in KitchenClips." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="KitchenClips" />
    <meta property="og:title" content="KitchenClips Recipe Share" />
    <meta property="og:description" content="Open shared recipes directly in KitchenClips." />
    <meta property="og:url" content="https://kitchenclips.org/share" />
    <meta property="og:image" content="https://kitchenclips.org/share/share-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="1200" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="KitchenClips Recipe Share" />
    <meta name="twitter:description" content="Open shared recipes directly in KitchenClips." />
    <meta name="twitter:image" content="https://kitchenclips.org/share/share-preview.png" />
    <meta name="apple-itunes-app" content="app-id=6749102051" />
    <style>
      :root {
        --kc-accent: #ffc550;
        --kc-accent-dark: #e6b148;
        --kc-bg: #ffffff;
        --kc-surface: #ffffff;
        --kc-text: #212529;
        --kc-muted: #6c757d;
        --kc-border: #e9ecef;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: var(--kc-bg);
        color: var(--kc-text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }

      .kc-overlay-shell {
        max-width: 760px;
        margin: 0 auto;
        min-height: 100vh;
      }

      .kc-overlay-recipe {
        background: var(--kc-surface);
        border: 1px solid var(--kc-border);
        border-radius: 0;
        overflow: hidden;
      }

      .kc-card-content {
        padding: 16px;
      }

      .kc-overlay-recipe__header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--kc-border);
      }

      .kc-overlay-recipe__title {
        margin: 0;
        font-size: 1.15em;
        font-weight: 600;
        line-height: 1.4;
        color: var(--kc-text);
      }

      .kc-overlay-recipe__meta {
        display: none;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        margin-bottom: 12px;
        color: var(--kc-muted);
      }

      .kc-overlay-recipe__meta-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        min-width: 0;
        padding: 10px 8px;
        border-right: 1px solid var(--kc-border);
        text-align: center;
      }

      .kc-overlay-recipe__meta-item:last-child {
        border-right: 0;
      }

      .kc-overlay-recipe__meta-label {
        font-size: 0.625em;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--kc-muted);
      }

      .kc-overlay-recipe__meta-value {
        font-size: 0.75em;
        line-height: 1.2;
        font-weight: 600;
        text-transform: uppercase;
        color: var(--kc-text);
      }

      .kc-overlay-recipe__section {
        margin-bottom: 16px;
      }

      .kc-overlay-section__title {
        margin: 0 0 8px;
        font-size: 0.875em;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--kc-text);
      }

      .kc-overlay-ingredients-list,
      .kc-overlay-instructions-list {
        font-size: 1.00625em;
        line-height: 1.55;
        color: var(--kc-text);
        margin: 0;
        padding: 8px;
      }

      .kc-overlay-instructions-list {
        list-style: none;
        padding-top: 0;
      }

      .kc-overlay-ingredient-item {
        margin-bottom: 4px;
        position: relative;
        list-style: none;
        padding-left: 12px;
      }

      .kc-overlay-ingredient-item::before {
        content: "•";
        position: absolute;
        left: 0;
        color: var(--kc-accent);
      }

      .kc-overlay-instruction-item {
        margin-bottom: 8px;
        padding: 8px 12px;
        background: var(--kc-bg);
        border-left: 3px solid var(--kc-accent);
      }

      .kc-source-link {
        display: inline-block;
        margin-top: 6px;
        color: var(--kc-muted);
        text-decoration: none;
        font-size: 0.875em;
      }

      .kc-source-link:hover {
        color: var(--kc-text);
        text-decoration: underline;
      }

      .kc-empty {
        margin-top: 8px;
        padding: 8px 10px;
        border: 1px solid var(--kc-border);
        color: var(--kc-muted);
        font-size: 0.875em;
        line-height: 1.45;
      }

      .kc-overlay-actions {
        display: grid;
        margin-top: 20px;
        padding-top: 16px;
        grid-template-columns: 1fr;
        align-items: stretch;
        column-gap: 8px;
        row-gap: 8px;
        border-top: 1px solid var(--kc-border);
      }

      .kc-overlay-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 40px;
        border-radius: 6px;
        border: 1px solid var(--kc-border);
        padding: 10px 14px;
        font-size: 0.875em;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
        transition: background-color 0.2s;
      }

      .kc-overlay-btn--primary {
        background: var(--kc-accent);
        color: #ffffff;
      }

      .kc-overlay-btn--primary:hover {
        background: var(--kc-accent-dark);
      }

      .kc-overlay-btn--secondary {
        background: var(--kc-bg);
        color: var(--kc-text);
      }

      .kc-overlay-btn--secondary:hover {
        background: #f8f9fa;
      }

      @media (max-width: 22em) {
        .kc-overlay-recipe__meta {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .kc-overlay-recipe__meta-item {
          border-right: 0;
        }

        .kc-overlay-recipe__meta-item:nth-child(odd) {
          border-right: 1px solid var(--kc-border);
        }

        .kc-overlay-recipe__meta-item:nth-child(-n + 2) {
          border-bottom: 1px solid var(--kc-border);
        }
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --kc-bg: #1c1c1e;
          --kc-surface: #1c1c1e;
          --kc-text: #e0e0e0;
          --kc-muted: #a0a0a0;
          --kc-border: #333333;
        }

        .kc-overlay-btn--secondary:hover {
          background: #2a2a2a;
        }
      }
    </style>
  </head>
  <body>
    <main class="kc-overlay-shell">
      <article class="kc-overlay-recipe">
        <div class="kc-card-content">
          <header class="kc-overlay-recipe__header">
            <h1 id="title" class="kc-overlay-recipe__title">Recipe unavailable</h1>
          </header>

          <section id="meta" class="kc-overlay-recipe__meta" hidden></section>

          <section id="ingredientsSection" class="kc-overlay-recipe__section" hidden>
            <h2 class="kc-overlay-section__title">Ingredients</h2>
            <ul id="ingredients" class="kc-overlay-ingredients-list"></ul>
          </section>

          <section id="instructionsSection" class="kc-overlay-recipe__section" hidden>
            <h2 class="kc-overlay-section__title">Instructions</h2>
            <ol id="instructions" class="kc-overlay-instructions-list"></ol>
          </section>

          <a id="sourceLink" class="kc-source-link" href="#" rel="noopener noreferrer" hidden>View source page</a>
          <div id="empty" class="kc-empty" hidden></div>

          <footer class="kc-overlay-actions">
            <a
              id="openKitchenClipsButton"
              class="kc-overlay-btn kc-overlay-btn--secondary"
              href="https://apps.apple.com/us/app/kitchenclips/id6749102051"
              rel="noopener noreferrer"
            >
              Open KitchenClips
            </a>
          </footer>
        </div>
      </article>
    </main>

    <script>
      (async function () {
        const params = new URLSearchParams(window.location.search);
        const appStoreURL = "https://apps.apple.com/us/app/kitchenclips/id6749102051";
        const shareAPIBaseURL = "https://shares.kitchenclips.org";
        const shareID = clean(params.get("id")) || clean(params.get("share_id"));
        const sourceURL = normalizeURL(params.get("url"));
        const encodedRecipe = params.get("recipe");

        const titleNode = document.getElementById("title");
        const metaNode = document.getElementById("meta");
        const ingredientsSection = document.getElementById("ingredientsSection");
        const ingredientsNode = document.getElementById("ingredients");
        const instructionsSection = document.getElementById("instructionsSection");
        const instructionsNode = document.getElementById("instructions");
        const sourceLinkNode = document.getElementById("sourceLink");
        const emptyNode = document.getElementById("empty");
        const openKitchenClipsButton = document.getElementById("openKitchenClipsButton");

        let recipe = decodeRecipe(encodedRecipe);
        if (!recipe && shareID) {
          recipe = await fetchSharedRecipe(shareAPIBaseURL, shareID);
        }
        const recipeTitle = clean(recipe && recipe.name);
        const ingredients = cleanLines(recipe && recipe.ingredients);
        const instructions = cleanLines(recipe && recipe.instructions);
        const servings = clean(firstOf(recipe && recipe.yields)) || clean(recipe && recipe.servings);
        const prep = clean(recipe && recipe.prepTime);
        const cook = clean(recipe && recipe.cookTime);
        const total = clean(recipe && recipe.totalTime);

        if (recipeTitle) {
          titleNode.textContent = recipeTitle;
          document.title = `${recipeTitle} | KitchenClips`;
        } else if (sourceURL) {
          titleNode.textContent = "Shared recipe";
        }

        const hasRecipeContent = Boolean(
          recipeTitle || ingredients.length || instructions.length || servings || prep || cook || total
        );

        if (!hasRecipeContent) {
          emptyNode.hidden = false;
          if (shareID) {
            emptyNode.textContent =
              "This shared recipe may be unavailable or expired. You can still try opening it in KitchenClips.";
          } else {
            emptyNode.textContent =
              "Recipe data is missing or invalid. You can still try opening this in KitchenClips.";
          }
        }

        renderMeta(metaNode, [
          { label: "Servings", value: servings },
          { label: "Prep", value: prep },
          { label: "Cook", value: cook },
          { label: "Total", value: total }
        ]);

        renderLines(ingredientsSection, ingredientsNode, ingredients, "kc-overlay-ingredient-item");
        renderLines(instructionsSection, instructionsNode, instructions, "kc-overlay-instruction-item");

        if (sourceURL) {
          sourceLinkNode.hidden = false;
          sourceLinkNode.href = sourceURL;
        }

        const deepLink = buildDeepLink(shareID, sourceURL, encodedRecipe);
        configureOpenKitchenClipsButton(openKitchenClipsButton, deepLink, appStoreURL);

        if (deepLink) {
          attemptAutoOpenDeepLink(deepLink, appStoreURL);
        }
      })();

      function clean(value) {
        if (typeof value !== "string") return null;
        const trimmed = value.trim();
        return trimmed ? trimmed : null;
      }

      function firstOf(value) {
        return Array.isArray(value) && value.length > 0 ? value[0] : null;
      }

      function cleanLines(values) {
        if (!Array.isArray(values)) return [];
        return values.map(clean).filter(Boolean);
      }

      function normalizeURL(rawValue) {
        const value = clean(rawValue);
        if (!value) return null;

        try {
          const parsed = new URL(value);
          if (parsed.protocol === "http:" || parsed.protocol === "https:") {
            return parsed.toString();
          }
          return null;
        } catch (_) {
          try {
            const parsed = new URL(`https://${value}`);
            return parsed.toString();
          } catch (_) {
            return null;
          }
        }
      }

      function decodeRecipe(payload) {
        const value = clean(payload);
        if (!value) return null;

        const normalized = value.replace(/-/g, "+").replace(/_/g, "/");
        const padLength = (4 - (normalized.length % 4)) % 4;
        const padded = normalized + "=".repeat(padLength);

        try {
          const binary = atob(padded);
          const bytes = Uint8Array.from(binary, (char) => char.charCodeAt(0));
          const json = new TextDecoder().decode(bytes);
          return JSON.parse(json);
        } catch (_) {
          return null;
        }
      }

      async function fetchSharedRecipe(baseURL, shareID) {
        const normalizedID = clean(shareID);
        if (!normalizedID) return null;

        const endpoint = `${baseURL.replace(/\/+$/, "")}/v1/shares/${encodeURIComponent(normalizedID)}`;
        try {
          const response = await fetch(endpoint, {
            method: "GET",
            headers: {
              Accept: "application/json"
            }
          });
          if (!response.ok) return null;
          const body = await response.json();
          const kind = clean(body && body.kind);
          if (kind && kind.toLowerCase() !== "recipe") return null;
          const payload = body && body.payload;
          return payload && typeof payload === "object" ? payload : null;
        } catch (_) {
          return null;
        }
      }

      function renderMeta(container, items) {
        const visibleItems = items.filter((item) => Boolean(item.value));
        if (!visibleItems.length) {
          container.hidden = true;
          return;
        }

        container.hidden = false;
        container.innerHTML = "";

        for (const item of visibleItems) {
          const card = document.createElement("div");
          card.className = "kc-overlay-recipe__meta-item";

          const valueNode = document.createElement("strong");
          valueNode.className = "kc-overlay-recipe__meta-value";
          valueNode.textContent = item.value;

          const labelNode = document.createElement("span");
          labelNode.className = "kc-overlay-recipe__meta-label";
          labelNode.textContent = item.label;

          card.appendChild(valueNode);
          card.appendChild(labelNode);
          container.appendChild(card);
        }
      }

      function renderLines(sectionNode, listNode, values, itemClassName) {
        if (!values.length) {
          sectionNode.hidden = true;
          return;
        }

        sectionNode.hidden = false;
        listNode.innerHTML = "";

        for (const value of values) {
          const item = document.createElement("li");
          item.className = itemClassName;
          item.textContent = value;
          listNode.appendChild(item);
        }
      }

      function configureOpenKitchenClipsButton(buttonNode, deepLink, appStoreURL) {
        if (!buttonNode) return;

        buttonNode.href = appStoreURL;
        buttonNode.addEventListener("click", (event) => {
          if (!deepLink) return;
          event.preventDefault();
          openDeepLinkWithStoreFallback(deepLink, appStoreURL, { launchDelayMs: 0 });
        });
      }

      function attemptAutoOpenDeepLink(deepLink, appStoreURL) {
        const params = new URLSearchParams(window.location.search);
        if (params.get("no_auto_open") === "1") return;

        const ua = navigator.userAgent || "";
        const isIOS = /iPhone|iPad|iPod/i.test(ua) ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        if (!isIOS) return;

        const attemptFingerprint = [
          window.location.pathname,
          params.get("id") || params.get("share_id") || "",
          params.get("url") || "",
          params.get("recipe") || ""
        ].join("|");
        const attemptKey = "kc-share-auto-open:" + attemptFingerprint;

        try {
          if (sessionStorage.getItem(attemptKey) === "1") return;
          sessionStorage.setItem(attemptKey, "1");
        } catch (_) {
          // Ignore storage errors and still attempt once.
        }

        openDeepLinkWithStoreFallback(deepLink, appStoreURL, { launchDelayMs: 120 });
      }

      function openDeepLinkWithStoreFallback(deepLink, appStoreURL, options = {}) {
        const launchDelayMs = Number.isFinite(options.launchDelayMs) ? options.launchDelayMs : 0;
        const fallbackDelayMs = Number.isFinite(options.fallbackDelayMs) ? options.fallbackDelayMs : 1400;

        let pageHidden = false;
        const handleVisibilityChange = () => {
          if (document.visibilityState === "hidden") {
            pageHidden = true;
          }
        };

        document.addEventListener("visibilitychange", handleVisibilityChange);

        window.setTimeout(() => {
          if (document.visibilityState !== "visible") return;
          window.location.assign(deepLink);
        }, launchDelayMs);

        window.setTimeout(() => {
          document.removeEventListener("visibilitychange", handleVisibilityChange);
          if (pageHidden || document.visibilityState !== "visible") return;
          window.location.assign(appStoreURL);
        }, launchDelayMs + fallbackDelayMs);
      }

      function buildDeepLink(shareID, sourceURL, recipePayload) {
        const query = new URLSearchParams();
        if (clean(shareID)) query.set("share_id", shareID);
        if (sourceURL) query.set("url", sourceURL);
        if (clean(recipePayload)) query.set("recipe", recipePayload);

        const queryString = query.toString();
        if (!queryString) return null;
        return `kitchenclips://import?${queryString}`;
      }
    </script>
  </body>
</html>
