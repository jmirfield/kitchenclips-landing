<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shopping Cart from KitchenClips</title>
    <meta name="description" content="Open this shared shopping cart in KitchenClips." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="KitchenClips" />
    <meta property="og:title" content="Shopping Cart from KitchenClips" />
    <meta property="og:description" content="Open this shared shopping cart in the KitchenClips app." />
    <meta property="og:url" content="https://kitchenclips.org/share/cart/" />
    <meta property="og:image" content="https://kitchenclips.org/share/cart/share-preview.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Shopping Cart from KitchenClips" />
    <meta name="twitter:description" content="Open this shared shopping cart in the KitchenClips app." />
    <meta name="twitter:image" content="https://kitchenclips.org/share/cart/share-preview.png" />
    <meta name="apple-itunes-app" content="app-id=6749102051" />
    <style>
      :root {
        --kc-bg: #f7efe2;
        --kc-card: rgba(255, 255, 255, 0.92);
        --kc-card-border: rgba(82, 64, 44, 0.12);
        --kc-text: #2e241b;
        --kc-muted: #6e6256;
        --kc-accent: #f0b649;
        --kc-accent-strong: #db9c26;
        --kc-shadow: 0 18px 40px rgba(73, 49, 22, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top, rgba(255, 255, 255, 0.85), transparent 42%),
          linear-gradient(180deg, #fbf4e8 0%, var(--kc-bg) 100%);
        color: var(--kc-text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }

      .kc-card {
        width: min(100%, 420px);
        padding: 32px 28px;
        border: 1px solid var(--kc-card-border);
        border-radius: 24px;
        background: var(--kc-card);
        box-shadow: var(--kc-shadow);
        text-align: center;
        backdrop-filter: blur(16px);
      }

      .kc-icon {
        width: 72px;
        height: 72px;
        margin-bottom: 18px;
        border-radius: 18px;
      }

      .kc-eyebrow {
        margin: 0 0 10px;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--kc-accent-strong);
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 6vw, 2.6rem);
        line-height: 1.02;
        letter-spacing: -0.04em;
      }

      p {
        margin: 14px 0 0;
        font-size: 1rem;
        line-height: 1.55;
        color: var(--kc-muted);
      }

      .kc-items {
        margin: 20px 0 0;
        padding: 16px 18px;
        border-radius: 20px;
        background: rgba(240, 182, 73, 0.12);
        text-align: left;
      }

      .kc-items[hidden] {
        display: none;
      }

      .kc-items-title {
        margin: 0 0 10px;
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--kc-accent-strong);
      }

      .kc-items-list {
        margin: 0;
        padding-left: 18px;
        color: var(--kc-text);
      }

      .kc-items-list li + li {
        margin-top: 8px;
      }

      .kc-items-more {
        margin-top: 12px;
        font-size: 0.95rem;
        color: var(--kc-muted);
      }

      .kc-actions {
        display: grid;
        gap: 12px;
        margin-top: 24px;
      }

      .kc-button,
      .kc-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 52px;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 700;
      }

      .kc-button {
        border: 0;
        background: var(--kc-accent);
        color: #241706;
      }

      .kc-button:hover {
        background: #f6bf58;
      }

      .kc-link {
        color: var(--kc-muted);
      }

      .kc-link:hover {
        color: var(--kc-text);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --kc-bg: #17120d;
          --kc-card: rgba(35, 28, 21, 0.9);
          --kc-card-border: rgba(255, 255, 255, 0.08);
          --kc-text: #f6efe7;
          --kc-muted: #c7b9aa;
          --kc-shadow: 0 18px 40px rgba(0, 0, 0, 0.28);
        }

        body {
          background:
            radial-gradient(circle at top, rgba(76, 57, 24, 0.45), transparent 38%),
            linear-gradient(180deg, #201811 0%, var(--kc-bg) 100%);
        }

        .kc-button {
          color: #241706;
        }
      }
    </style>
  </head>
  <body>
    <main class="kc-card">
      <img src="/assets/Icon.png" alt="KitchenClips logo" class="kc-icon" />
      <p class="kc-eyebrow">KitchenClips</p>
      <h1 id="headline">Opening in KitchenClips</h1>
      <p id="message">
        If the app is installed, this cart should open automatically. If not, download
        KitchenClips from the App Store.
      </p>
      <section id="itemsPreview" class="kc-items" hidden>
        <p class="kc-items-title">Items in this cart</p>
        <ul id="itemsList" class="kc-items-list"></ul>
        <p id="itemsMore" class="kc-items-more" hidden></p>
      </section>
      <div class="kc-actions">
        <a
          id="cta"
          class="kc-button"
          href="https://apps.apple.com/us/app/kitchenclips/id6749102051"
          rel="noopener noreferrer"
        >
          Open KitchenClips
        </a>
        <a
          class="kc-link"
          href="https://apps.apple.com/us/app/kitchenclips/id6749102051"
          rel="noopener noreferrer"
        >
          Get KitchenClips on the App Store
        </a>
      </div>
    </main>

    <script>
      (function () {
        const params = new URLSearchParams(window.location.search);
        const appStoreURL = "https://apps.apple.com/us/app/kitchenclips/id6749102051";
        const ctaNode = document.getElementById("cta");
        const headlineNode = document.getElementById("headline");
        const messageNode = document.getElementById("message");
        const itemsPreviewNode = document.getElementById("itemsPreview");
        const itemsListNode = document.getElementById("itemsList");
        const itemsMoreNode = document.getElementById("itemsMore");
        const cartTitle = clean(params.get("title"));
        const sharedItems = params.getAll("item").map(clean).filter(Boolean);
        const itemCount = parsePositiveInteger(params.get("item_count"));
        const deepLink = buildDeepLink(clean(params.get("id")) || clean(params.get("share_id")));

        applyCartShareContent({
          cartTitle,
          sharedItems,
          itemCount,
          headlineNode,
          messageNode,
          itemsPreviewNode,
          itemsListNode,
          itemsMoreNode
        });
        configureCTA(ctaNode, deepLink, appStoreURL);

        if (deepLink) {
          attemptAutoOpenDeepLink(deepLink, appStoreURL);
          return;
        }

        headlineNode.textContent = "Get KitchenClips";
        messageNode.textContent =
          "This cart opens in the KitchenClips app. Download it from the App Store to continue.";
        ctaNode.textContent = "View on the App Store";
        ctaNode.href = appStoreURL;
      })();

      function applyCartShareContent({
        cartTitle,
        sharedItems,
        itemCount,
        headlineNode,
        messageNode,
        itemsPreviewNode,
        itemsListNode,
        itemsMoreNode
      }) {
        const previewCount = sharedItems.length;
        const totalCount = itemCount || previewCount;
        const summaryLabel = buildCartSummary(sharedItems, totalCount);
        const pageTitle = summaryLabel || cartTitle || "Shopping Cart from KitchenClips";
        const pageDescription = totalCount > 0
          ? `Open a shared KitchenClips cart with ${totalCount} item${totalCount === 1 ? "" : "s"}.`
          : "Open this shared shopping cart in the KitchenClips app.";

        if (headlineNode) {
          headlineNode.textContent = cartTitle || "Shared Shopping Cart";
        }

        if (messageNode && totalCount > 0) {
          messageNode.textContent = `This cart includes ${totalCount} item${totalCount === 1 ? "" : "s"}. Open it in KitchenClips to add everything at once.`;
        }

        if (itemsPreviewNode && itemsListNode && previewCount > 0) {
          itemsPreviewNode.hidden = false;
          itemsListNode.replaceChildren(
            ...sharedItems.map((item) => {
              const listItem = document.createElement("li");
              listItem.textContent = item;
              return listItem;
            })
          );
        }

        if (itemsMoreNode) {
          const overflowCount = Math.max(totalCount - previewCount, 0);
          itemsMoreNode.hidden = overflowCount <= 0;
          if (overflowCount > 0) {
            itemsMoreNode.textContent = `Plus ${overflowCount} more item${overflowCount === 1 ? "" : "s"}.`;
          }
        }

        updateMetaContent("title", pageTitle);
        updateMetaContent('meta[name="description"]', pageDescription);
        updateMetaContent('meta[property="og:title"]', pageTitle);
        updateMetaContent('meta[property="og:description"]', pageDescription);
        updateMetaContent('meta[property="og:url"]', window.location.href);
        updateMetaContent('meta[name="twitter:title"]', pageTitle);
        updateMetaContent('meta[name="twitter:description"]', pageDescription);
      }

      function clean(value) {
        if (typeof value !== "string") return null;
        const trimmed = value.trim();
        return trimmed ? trimmed : null;
      }

      function parsePositiveInteger(value) {
        const parsed = Number.parseInt(value, 10);
        return Number.isFinite(parsed) && parsed > 0 ? parsed : null;
      }

      function buildCartSummary(items, totalCount) {
        if (!items.length) {
          return totalCount > 0
            ? `${totalCount} Cart Item${totalCount === 1 ? "" : "s"} from KitchenClips`
            : null;
        }

        const joinedItems = items.join(", ");
        const overflowCount = Math.max(totalCount - items.length, 0);
        return overflowCount > 0 ? `${joinedItems} +${overflowCount} more` : joinedItems;
      }

      function configureCTA(buttonNode, deepLink, appStoreURL) {
        if (!buttonNode) return;

        buttonNode.href = deepLink || appStoreURL;
        buttonNode.addEventListener("click", (event) => {
          if (!deepLink) return;
          event.preventDefault();
          openDeepLinkWithStoreFallback(deepLink, appStoreURL, { launchDelayMs: 0 });
        });
      }

      function attemptAutoOpenDeepLink(deepLink, appStoreURL) {
        const params = new URLSearchParams(window.location.search);
        if (params.get("no_auto_open") === "1") return;

        const ua = navigator.userAgent || "";
        const isIOS =
          /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        if (!isIOS) return;

        const attemptFingerprint = [
          window.location.pathname,
          params.get("id") || params.get("share_id") || ""
        ].join("|");
        const attemptKey = "kc-cart-share-auto-open:" + attemptFingerprint;

        try {
          if (sessionStorage.getItem(attemptKey) === "1") return;
          sessionStorage.setItem(attemptKey, "1");
        } catch (_) {
          // Ignore storage errors and still attempt once.
        }

        openDeepLinkWithStoreFallback(deepLink, appStoreURL, { launchDelayMs: 120 });
      }

      function openDeepLinkWithStoreFallback(deepLink, appStoreURL, options = {}) {
        const launchDelayMs = Number.isFinite(options.launchDelayMs) ? options.launchDelayMs : 0;
        const fallbackDelayMs = Number.isFinite(options.fallbackDelayMs) ? options.fallbackDelayMs : 1400;

        let pageHidden = false;
        const handleVisibilityChange = () => {
          if (document.visibilityState === "hidden") {
            pageHidden = true;
          }
        };

        document.addEventListener("visibilitychange", handleVisibilityChange);

        window.setTimeout(() => {
          if (document.visibilityState !== "visible") return;
          window.location.assign(deepLink);
        }, launchDelayMs);

        window.setTimeout(() => {
          document.removeEventListener("visibilitychange", handleVisibilityChange);
          if (pageHidden || document.visibilityState !== "visible") return;
          window.location.assign(appStoreURL);
        }, launchDelayMs + fallbackDelayMs);
      }

      function buildDeepLink(shareID) {
        const normalizedID = clean(shareID);
        if (!normalizedID) return null;

        const query = new URLSearchParams();
        query.set("share_id", normalizedID);
        return `kitchenclips://import?${query.toString()}`;
      }

      function updateMetaContent(selector, value) {
        if (!value) return;
        if (selector === "title") {
          document.title = value;
          return;
        }

        const node = document.querySelector(selector);
        if (node) node.setAttribute("content", value);
      }
    </script>
  </body>
</html>
